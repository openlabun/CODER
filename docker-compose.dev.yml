# DEVELOPMENT ENVIRONMENT
# Use: docker-compose -f docker-compose.dev.yml up
version: "3.9"

services:
    apiv2:
        build:
            context: ./apps/api_v2
            dockerfile: Dockerfile.dev
        working_dir: /app
        command: air -c .air.toml
        ports:
            - "${APIV2_PORT:-4000}:4000"
        volumes:
            - ./apps/api_v2:/app
        env_file:
            - .env.dev
        depends_on:
            rabbitmq:
                condition: service_healthy
        networks:
            - judge_net

    rabbitmq:
        image: rabbitmq:3.13-management
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - judge_net

    worker:
        build:
            context: ./apps/worker
            dockerfile: Dockerfile
        working_dir: /app
        command: python main.py
        env_file:
            - .env.dev
        environment:
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
            - APIV2_BASE_URL=http://apiv2:4000
            - PYTHON_QUEUE=python.queue
            - RUNNER_NETWORK=judge_net
            - PYTHON_RUNNER_IMAGE=coder-runner-python
            - CPP_RUNNER_IMAGE=coder-runner-cpp
            - JAVA_RUNNER_IMAGE=coder-runner-java
            - PYTHON_RUNNERS=${PYTHON_RUNNERS:-3}
            - CPP_RUNNERS=${CPP_RUNNERS:-3}
            - JAVA_RUNNERS=${JAVA_RUNNERS:-3}
            - RUNNER_HEALTH_CHECK_TIMEOUT=${RUNNER_HEALTH_CHECK_TIMEOUT:-2.0}
            - RUNNER_RESTART_TIMEOUT=${RUNNER_RESTART_TIMEOUT:-120.0}
            - RUNNER_REPAIR_INTERVAL=${RUNNER_REPAIR_INTERVAL:-30.0}
        volumes:
            - ./apps/worker:/app
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            apiv2:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        networks:
            - judge_net

    runner-python:
        profiles: ["runners"]
        build:
            context: ./apps/worker/runners/python
        image: coder-runner-python

    runner-cpp:
        profiles: ["runners"]
        build:
            context: ./apps/worker/runners/cpp
        image: coder-runner-cpp

    runner-java:
        profiles: ["runners"]
        build:
            context: ./apps/worker/runners/java
        image: coder-runner-java

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile.dev
        command: npm run dev -- --host
        ports:
            - "${WEB_PORT:-5173}:5173"
        volumes:
            - ./apps/web:/usr/src/app
            - /usr/src/app/node_modules
        env_file:
            - .env.dev
        networks:
            - judge_net
        depends_on:
            - apiv2
volumes:
    pgdata:


networks:
    judge_net:
        driver: bridge
        name: judge_net
