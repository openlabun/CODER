# PRODUCTION ENVIRONMENT
# Use: docker compose -f docker-compose.yml up -d --build
version: "3.9"

services:
    apiv2:
        build:
            context: ./apps/api_v2
            dockerfile: Dockerfile.prod
        restart: always
        expose:
            - "${APIV2_PORT:-4000}"
        env_file:
            - .env.production
        environment:
            - APIV2_PORT=${APIV2_PORT:-4000}
            - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
        depends_on:
            rabbitmq:
                condition: service_healthy
        networks:
            - judge_net

    rabbitmq:
        image: rabbitmq:3.13-management
        restart: always
        expose:
            - "5672"
            - "15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 60s
            timeout: 60s
            retries: 20
        networks:
            - judge_net

    worker:
        build:
            context: ./apps/worker
            dockerfile: Dockerfile
        working_dir: /app
        command: python main.py
        restart: always
        env_file:
            - .env.production
        environment:
            - APIV2_BASE_URL=http://apiv2:${APIV2_PORT:-4000}
            - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
            - PYTHON_QUEUE=${PYTHON_QUEUE:-python.queue}
            - WORKER_KEY=${WORKER_KEY}
            - RUNNER_NETWORK=${RUNNER_NETWORK:-judge_net}
            - RUNNER_NAME_PREFIX=${RUNNER_NAME_PREFIX:-coder-runner}
            - PYTHON_RUNNER_IMAGE=${PYTHON_RUNNER_IMAGE:-coder-runner-python}
            - PYTHON_RUNNERS=${PYTHON_RUNNERS:-3}
            - RUNNER_HEALTH_CHECK_TIMEOUT=${RUNNER_HEALTH_CHECK_TIMEOUT:-2.0}
            - RUNNER_RESTART_TIMEOUT=${RUNNER_RESTART_TIMEOUT:-120.0}
            - RUNNER_REPAIR_INTERVAL=${RUNNER_REPAIR_INTERVAL:-30.0}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            apiv2:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        networks:
            - judge_net
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 2G

    runner-python:
        profiles: ["judge"]
        build:
            context: ./apps/worker/runners/python
        image: coder-runner-python

    runner-cpp:
        profiles: ["judge"]
        build:
            context: ./apps/worker/runners/cpp
        image: coder-runner-cpp

    runner-java:
        profiles: ["judge"]
        build:
            context: ./apps/worker/runners/java
        image: coder-runner-java

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile.prod
        ports:
            - "${WEB_PORT:-5173}:5173"
        environment:
            - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
            - WEB_PORT=${WEB_PORT:-5173}
            - NODE_ENV=${NODE_ENV:-production}
        networks:
            - judge_net
        depends_on:
            - apiv2
networks:
    judge_net:
        driver: bridge
        name: judge_net
